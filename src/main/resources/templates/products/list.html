<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Danh sách Sản phẩm</title>
</head>
<body>
<main layout:fragment="content">
    <div class="page-title">
        <h1>Quản lý Sản phẩm</h1>
        <a th:href="@{/products/create}" class="btn primary">+ Thêm sản phẩm mới</a>
    </div>

    <!-- FLASH MESSAGES -->
    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <!-- TÌM KIẾM -->
    <div class="panel" style="padding: 16px 20px;">
        <form th:action="@{/products}" method="get" class="search" style="margin: 0;">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm theo tên sản phẩm...">
            <button type="submit" class="btn primary">Tìm kiếm</button>
            <a th:href="@{/products}" class="btn secondary" th:if="${keyword != null and !keyword.isEmpty()}">Làm mới</a>
        </form>
    </div>

    <!-- DANH SÁCH DẠNG GRID CARDS -->
    <div class="grid-products" th:if="${products.content != null and !products.content.isEmpty()}">
        <div class="product-card" th:each="p : ${products.content}">
            <img th:if="${p.images != null and !p.images.isEmpty()}"
                 th:src="${p.images[0].imageUrl}" alt="Ảnh sản phẩm" class="product-img"
                 onerror="this.src='/images/default-image.png'">
            <img th:unless="${p.images != null and !p.images.isEmpty()}"
                 src="/images/default-image.png" alt="Ảnh mặc định" class="product-img">

            <div class="product-body">
                <div class="product-title" th:text="${p.name}">Tên sản phẩm</div>
                <div class="product-price" th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA') + ' VNĐ'}">0 VNĐ</div>
                <div style="font-size: 13px; color: #64748b; margin-bottom: 6px;">
                    Kho: <strong th:text="${p.quantity}">0</strong> sản phẩm
                </div>
                <div style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">
                    Đăng bởi: <span th:text="${p.userFullName != null ? p.userFullName : 'Hệ thống'}">Admin</span>
                </div>
                <p class="product-desc" th:text="${p.description != null ? #strings.abbreviate(p.description, 80) : 'Chưa có mô tả'}"></p>

                <div class="actions" style="margin-top: auto; justify-content: space-between;">
                    <a th:href="@{/products/detail/{id}(id=${p.id})}" class="btn secondary small">Chi tiết</a>
                    <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn primary small">Sửa</a>
                    <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn danger small"
                                onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');">Xóa</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="panel" th:if="${products.content == null or products.content.isEmpty()}" style="text-align: center; padding: 40px; color: #64748b;">
        <p style="font-size: 16px;">Không tìm thấy sản phẩm nào.</p>
        <a th:href="@{/products/create}" class="btn primary small">+ Tạo sản phẩm đầu tiên</a>
    </div>

    <!-- PHÂN TRANG -->
    <div class="pagination" th:if="${totalPages > 1}">
        <a th:if="${currentPage > 0}"
           th:href="@{/products(keyword=${keyword}, page=${currentPage - 1})}">&laquo; Trước</a>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
              th:classappend="${i == currentPage ? 'active' : ''}">
            <a th:if="${i != currentPage}"
               th:href="@{/products(keyword=${keyword}, page=${i})}" th:text="${i + 1}">1</a>
            <span th:if="${i == currentPage}" th:text="${i + 1}">1</span>
        </span>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/products(keyword=${keyword}, page=${currentPage + 1})}">Sau &raquo;</a>
    </div>
</main>
</body>
</html>
