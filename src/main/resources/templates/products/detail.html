<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${product.name}">Chi tiết sản phẩm</title>
</head>
<body>
<main layout:fragment="content">
    <div class="page-title">
        <h1 th:text="${product.name}">Chi tiết sản phẩm</h1>
        <a th:href="@{/products}" class="btn secondary small">&larr; Danh sách sản phẩm</a>
    </div>

    <div class="panel" style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 30px;">
        <!-- KHU VỰC ẢNH SẢN PHẨM -->
        <div>
            <!-- Ảnh chính lớn -->
            <div style="border-radius: 12px; overflow: hidden; background-color: #f8fafc; border: 1px solid #e2e8f0; height: 350px; display: flex; align-items: center; justify-content: center;">
                <img th:if="${product.images != null and !product.images.isEmpty()}"
                     th:src="${product.images[0].imageUrl}"
                     id="mainImage"
                     style="width: 100%; height: 100%; object-fit: contain;"
                     onerror="this.src='/images/default-image.png'">
                <img th:unless="${product.images != null and !product.images.isEmpty()}"
                     src="/images/default-image.png"
                     style="width: 100%; height: 100%; object-fit: contain;">
            </div>

            <!-- Thumbnail list -->
            <div th:if="${product.images != null and product.images.size() > 1}"
                 style="display: flex; gap: 10px; margin-top: 14px; overflow-x: auto;">
                <img th:each="img : ${product.images}"
                     th:src="${img.imageUrl}"
                     class="thumb"
                     style="cursor: pointer; width: 64px; height: 64px;"
                     onclick="document.getElementById('mainImage').src = this.src"
                     onerror="this.src='/images/default-image.png'">
            </div>
        </div>

        <!-- KHU VỰC THÔNG TIN -->
        <div>
            <h2 style="margin-top: 0; font-size: 26px; color: #0f172a;" th:text="${product.name}">Tên sản phẩm</h2>
            <div style="color: #dc2626; font-size: 28px; font-weight: 800; margin: 16px 0;"
                 th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA') + ' VNĐ'}">0 VNĐ</div>

            <div style="margin-bottom: 12px; color: #475569; font-size: 15px;">
                Tình trạng kho:
                <span class="badge" th:classappend="${product.quantity > 0 ? 'badge-success' : 'badge-danger'}"
                      th:text="${product.quantity > 0 ? 'Còn hàng (' + product.quantity + ')' : 'Hết hàng'}">Còn hàng</span>
            </div>

            <div style="margin-bottom: 16px; color: #64748b; font-size: 14px;">
                Người đăng bán: <strong th:text="${product.userFullName != null ? product.userFullName : 'Hệ thống'}">System</strong>
            </div>

            <div style="border-top: 1px solid #e2e8f0; padding-top: 16px; margin-top: 20px;">
                <h3 style="font-size: 16px; margin-bottom: 8px; color: #334155;">Mô tả chi tiết:</h3>
                <p style="line-height: 1.6; color: #334155; white-space: pre-line;"
                   th:text="${product.description != null ? product.description : 'Sản phẩm này chưa có mô tả chi tiết.'}"></p>
            </div>

            <div style="margin-top: 30px; display: flex; gap: 10px;">
                <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn primary">Chỉnh sửa</a>
                <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn danger"
                            onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');">Xóa sản phẩm</button>
                </form>
                <a th:href="@{/products}" class="btn secondary">Quay lại</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
