<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Thiết lập mật khẩu mới</h2>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div>
            <label for="email">Địa chỉ Email</label>
            <input type="email" id="email" th:field="*{email}" readonly style="background-color: #f1f5f9; cursor: not-allowed;">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div>
            <label for="otp">Mã OTP (6 chữ số)</label>
            <input type="text" id="otp" th:field="*{otp}" placeholder="VD: 123456" maxlength="6" autofocus required
                   style="text-align: center; font-size: 18px; letter-spacing: 4px; font-weight: 700;">
            <span class="field-error" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></span>
        </div>

        <div>
            <label for="newPassword">Mật khẩu mới</label>
            <input type="password" id="newPassword" th:field="*{newPassword}" placeholder="Tối thiểu 6 ký tự" required>
            <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
        </div>

        <div>
            <label for="confirmPassword">Xác nhận mật khẩu mới</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới" required>
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>

        <div class="mt">
            <button class="btn primary full" type="submit">Đổi mật khẩu</button>
        </div>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 14px;">
        <a th:href="@{/login}" style="color: #2563eb; text-decoration: none;">&larr; Quay lại Đăng nhập</a>
    </div>
</div>
</body>
</html>
