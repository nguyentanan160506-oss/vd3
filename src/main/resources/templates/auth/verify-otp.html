<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác thực mã OTP - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Xác thực tài khoản bằng OTP</h2>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div>
            <label for="email">Địa chỉ Email xác thực</label>
            <input type="email" id="email" th:field="*{email}" readonly style="background-color: #f1f5f9; cursor: not-allowed;">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div>
            <label for="otp">Nhập mã OTP (6 chữ số)</label>
            <input type="text" id="otp" th:field="*{otp}" placeholder="VD: 123456" maxlength="6" autofocus required
                   style="text-align: center; font-size: 20px; letter-spacing: 6px; font-weight: 700;">
            <span class="field-error" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></span>
        </div>

        <div class="mt">
            <button class="btn primary full" type="submit">Xác nhận kích hoạt</button>
        </div>
    </form>

    <div style="margin-top: 20px; text-align: center;">
        <form th:action="@{/register/resend-otp}" method="post" style="display: inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
            <button type="submit" class="link-button" style="background: none; color: #2563eb; padding: 0; font-size: 14px; text-decoration: underline;">
                Chưa nhận được mã? Gửi lại OTP
            </button>
        </form>
    </div>

    <div style="margin-top: 15px; text-align: center; font-size: 13px;">
        <a th:href="@{/login}" style="color: #64748b; text-decoration: none;">&larr; Quay lại Đăng nhập</a>
    </div>
</div>
</body>
</html>
