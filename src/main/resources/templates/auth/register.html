<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card" style="width: min(520px, 94vw);">
    <h1>IOTSTAR SHOP</h1>
    <h2>Đăng ký tài khoản</h2>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}">Lỗi đăng ký</div>

    <form th:action="@{/register}" th:object="${registerDTO}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div>
            <label for="username">Tên đăng nhập (Username) *</label>
            <input type="text" id="username" th:field="*{username}" placeholder="Nhập tên đăng nhập...">
            <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div>
            <label for="email">Địa chỉ Email *</label>
            <input type="email" id="email" th:field="*{email}" placeholder="example@domain.com">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div>
            <label for="fullName">Họ và tên *</label>
            <input type="text" id="fullName" th:field="*{fullName}" placeholder="Nguyễn Văn A">
            <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </div>

        <div>
            <label for="password">Mật khẩu *</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự">
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div>
            <label for="confirmPassword">Xác nhận mật khẩu *</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu...">
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>

        <div>
            <label for="avatarFile">Ảnh đại diện (Upload Cloudinary)</label>
            <input type="file" id="avatarFile" th:field="*{avatarFile}" accept="image/*">
        </div>

        <div class="mt">
            <button class="btn primary full" type="submit">Đăng ký &amp; Nhận OTP</button>
        </div>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 14px;">
        Đã có tài khoản?
        <a th:href="@{/login}" style="color: #2563eb; text-decoration: none; font-weight: 600;">Đăng nhập tại đây</a>
    </div>
</div>
</body>
</html>
