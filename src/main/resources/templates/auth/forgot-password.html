<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Khôi phục mật khẩu</h2>

    <p style="color: #64748b; font-size: 14px; text-align: center; margin-bottom: 20px;">
        Vui lòng nhập địa chỉ email bạn đã đăng ký. Hệ thống sẽ gửi một mã OTP 6 số để bạn thiết lập mật khẩu mới.
    </p>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div>
            <label for="email">Địa chỉ Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="example@domain.com" required autofocus>
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="mt">
            <button class="btn primary full" type="submit">Gửi mã OTP qua Email</button>
        </div>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 14px;">
        <a th:href="@{/login}" style="color: #2563eb; text-decoration: none;">&larr; Quay lại Đăng nhập</a>
    </div>
</div>
</body>
</html>
