<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">IOTSTAR SHOP</a>
    </div>

    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/products}">Sản phẩm</a>
        <a th:href="@{/dashboard}" sec:authorize="hasRole('ADMIN')">Dashboard</a>
        <a th:href="@{/users}" sec:authorize="hasRole('ADMIN')">Quản lý User</a>
    </nav>

    <!-- KHI ĐÃ ĐĂNG NHẬP -->
    <div class="account" sec:authorize="isAuthenticated()">
        <!-- Avatar -->
        <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
             alt="Avatar"
             class="user-avatar"
             onerror="this.src='/images/avatar-default.png'">

        <!-- Thông tin User -->
        <div class="user-info">
            <span class="user-name" th:text="${#authentication.principal.fullName != null ? #authentication.principal.fullName : #authentication.principal.username}">User</span>
            <span class="user-role" th:text="${#authentication.principal.role}">USER</span>
        </div>

        <!-- Logout Button -->
        <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 8px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>

    <!-- KHI CHƯA ĐĂNG NHẬP -->
    <div class="account" sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}" class="btn primary small" style="color: #fff; text-decoration: none;">Đăng nhập</a>
        <a th:href="@{/register}" class="btn secondary small" style="text-decoration: none;">Đăng ký</a>
    </div>
</header>
</body>
</html>
