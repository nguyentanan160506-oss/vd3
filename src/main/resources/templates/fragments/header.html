<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">IOTSTAR SHOP</a>
    </div>

    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/products}">Sản phẩm</a>
        <a th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')">Dashboard</a>
        <a th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')">Quản lý User</a>
    </nav>

    <!-- KHI ĐÃ ĐĂNG NHẬP -->
    <div class="account" sec:authorize="isAuthenticated()"
         th:with="u=${#authentication.principal instanceof T(vn.iotstar.security.CustomUserDetails) ? #authentication.principal : null}">
        <!-- Avatar / images -->
        <img th:src="${u != null and u.images != null and !#strings.isEmpty(u.images) ? u.images : '/images/avatar-default.png'}"
             alt="Avatar"
             class="user-avatar"
             onerror="this.src='/images/avatar-default.png'">

        <!-- Thông tin User: Fullname, Username, Email, Role -->
        <div class="user-info">
            <div class="user-info-row-top">
                <span class="user-fullname" th:text="${u != null and u.fullName != null and !#strings.isEmpty(u.fullName) ? u.fullName : #authentication.name}">Họ và tên</span>
                <span class="user-username" th:text="'(@' + ${u != null ? u.username : #authentication.name} + ')'">(@username)</span>
                <span class="user-role-badge" th:text="${u != null and u.role != null ? u.role : #strings.listJoin(#authentication.authorities.![authority], ', ')}">ROLE_USER</span>
            </div>
            <div class="user-info-row-bottom">
                <span class="user-email" th:text="${u != null and u.email != null ? u.email : ''}">email@example.com</span>
            </div>
        </div>

        <!-- Logout Button -->
        <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 8px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>

    <!-- KHI CHƯA ĐĂNG NHẬP -->
    <div class="account" sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}" class="btn primary small" style="color: #fff; text-decoration: none;">Đăng nhập</a>
    </div>
</header>
</body>
</html>
